[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-apple-reminders"
version = "0.1.0"
description = "Model Context Protocol server for Apple Reminders integration"
authors = [
    {name = "Pierce", email = "pierce@piercemoore.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "apple", "reminders", "eventkit", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: MacOS :: MacOS X",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "mcp>=1.27,<2",
    "pydantic>=2.10,<3",
    "pyobjc-core>=12.0,<13",
    "pyobjc-framework-EventKit>=12.0,<13",
    "pyobjc-framework-Cocoa>=12.0,<13",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=3.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/rex/mcp-apple-reminders"
Repository = "https://github.com/rex/mcp-apple-reminders"
Issues = "https://github.com/rex/mcp-apple-reminders/issues"

[project.scripts]
mcp-apple-reminders = "mcp_apple_reminders:cli_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 120
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "C4", "PT", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
